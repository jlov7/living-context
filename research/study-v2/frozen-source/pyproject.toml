[project]
name = "living-context"
version = "0.0.1"
description = "Revision-aware updateable learned-context runtime: selective refresh of learned KV artifacts under document change."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jason Lovell" }]
license = { file = "LICENSE" }
keywords = ["learned-context", "kv-cache", "cartridges", "revision-aware", "retrieval-baseline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
# Required ONLY by the model experiments (canary probe, baselines, arms,
# refresh demo, frozen pilot). The core library (catalog/refresh/artifacts/
# dependencies) and the 22-test suite run without them.
mlx = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "psutil==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_context"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["mlx: requires an Apple Metal MLX runtime"]

# NOTE: no torch/transformers/upstream-cartridge dependency is pinned yet.
# It must be resolved by Milestone 0 after inspecting the actual upstream
# implementation and this machine's supported backends (MPS vs CPU).
# Do not assume the upstream recipe runs unchanged here.

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["src/living_context"]

[tool.coverage.report]
fail_under = 90
show_missing = true
