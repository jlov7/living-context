# Frozen pilot protocol — Living Context Milestone D
#
# FROZEN BEFORE THE RUN. Deviations found during execution are recorded as
# discoveries in the run output — never silently repaired on the test split.
# Any change to this file after the first run invalidates the run's status as
# "frozen"; re-freeze and re-run.

protocol:
  name: living-context-pilot-v1
  status: FROZEN
  frozen_at: 2026-09-21

# Machine and model are part of the contract (never inferred after the fact).
machine:
  chip: Apple-M4-Max
  ram_gb: 48
  backend: MLX
  model: mlx-community/Llama-3.2-1B-Instruct-4bit
  model_quant: 4bit
  model_frozen: true

# The primary outcome is current-version answer accuracy by change family.
# Pre-registered non-inferiority margin for the pilot: learned arms must stay
# within 1 answer of the strong cached-text baseline on the pre-registered set,
# OR the comparison is reported as "cannot claim non-inferiority at n=..."
# (no equivalence claim from a non-significant difference — protocol §5).
design:
  arms:
    - id: 1
      name: cached-text-fresh-index
      role: baseline
    - id: 4
      name: learned-selective-refresh
      role: treatment
  repeats: 3
  splits:
    development: hydraulics/supply
    test: compliance
  scheduler_inputs:
    - development-query-frequency
    - source-churn
    - measured-rebuild-cost
  test_label_access: forbidden   # enforced by tests/test_no_test_label_access.py

# Pre-registered question set: ONE representative question per test family at
# the CURRENT (v3) revision. Created before the run; not edited afterwards.
# answer must appear verbatim (case-insensitive) in the model output.
questions:
  - id: q-hydraulics
    family: hydraulics
    doc: hydraulics/h-tank
    question: What is the volume of the T-4 tank?
    answer: "45"
  - id: q-compliance
    family: compliance
    doc: compliance/c-label
    question: What max fill pressure must the label state?
    answer: "200"
  - id: q-supply
    family: supply
    doc: supply/s-spec
    question: Which alloy does spec SP-1 require?
    answer: AL-7075

# Reporting contract (protocol §5): physical units + wall time BEFORE any
# price conversion. Failures are retained, never tidied.
reporting:
  primary: current-version-answer-accuracy-by-family
  secondary:
    - stale-answer-frequency
    - refresh-wall-time-s
    - serving-wall-time-s
    - peak-memory-bytes
    - failed-attempts
  lifecycle_cost: initial-preparation + refresh + serving (physical units)
  equivalence_claim: forbidden-from-nonsignificant-difference