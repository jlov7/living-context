name: Model-free candidate checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Install locked model-free dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen pyright src tests scripts
      - name: Core tests and coverage
        run: uv run --frozen pytest tests/ -q -p no:cacheprovider --cov=src/living_context --cov-report=term-missing
      - name: Exact v2 text-evidence replay
        run: uv run --frozen python -m scripts.verify_study_v2
      - name: Exact v3 pilot saved-output replay
        run: uv run --frozen python scripts/replay_study_v3.py
      - name: Exact v3 revision saved-output replay
        run: uv run --frozen python -m scripts.replay_study_v3_revision
      - name: Archived v1 custody diagnostic
        run: uv run --frozen python scripts/check_reproduction.py
      - name: Build source and wheel
        run: uv build --no-sources
      - name: Fresh wheel install and lifecycle example outside checkout
        shell: bash
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/lc-wheel-env"
          uv pip install --python "$RUNNER_TEMP/lc-wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lc-wheel-env/bin/python" -m living_context.example_lifecycle
