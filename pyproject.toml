[project]
name = "living-context"
version = "0.1.0"
description = "Revision-aware context research methods and an in-memory catalog and refresh-planning reference."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jason Lovell" }]
license = { file = "LICENSE" }
keywords = ["revision-aware", "context-research", "refresh-planning", "retrieval-baseline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
]

[project.urls]
Repository = "https://github.com/jlov7/living-context"
Issues = "https://github.com/jlov7/living-context/issues"
Security = "https://github.com/jlov7/living-context/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "psutil==7.1.0",
    "ruff>=0.9",
]
# Required only by the archived model experiments and bounded study runner.
# The in-memory reference, example, and evidence replay do not require MLX.
mlx = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "psutil==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_context"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research/study-v2/frozen-source"]

[tool.ruff.format]
# These exact source bytes were frozen before their local study outputs.
exclude = ["experiments/revision_workload.py", "experiments/study_v3_qlora.py", "tests/test_study_v3_supervisor.py", "experiments/study_v3_revision.py", "tests/test_study_v3_revision.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["mlx: requires an Apple Metal MLX runtime"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["tests/test_replacement_study_mlx.py"]
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["src/living_context"]

[tool.coverage.report]
fail_under = 90
show_missing = true
